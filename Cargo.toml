[package]
name = "ghfs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.21"
libc = "0.2"
fuser = "0.17"
tokio = { version = "1.36", features = ["rt-multi-thread", "sync"] }
env_logger = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.128"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
